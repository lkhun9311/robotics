# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  # Feature branches run through their pull request only; a push trigger as well would run
  # every commit twice.
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build dev image
        run: |
          set -a; . ./.env; set +a
          docker build --target dev --build-arg ROS_IMAGE="$ROS_IMAGE" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            --build-arg ROS_SNAPSHOT="$ROS_SNAPSHOT" \
            --build-arg MENAGERIE_COMMIT="$MENAGERIE_COMMIT" -t robotics-dev:ci -f docker/Dockerfile .
      - name: vcan preflight
        # Loads vcan on the runner (the container cannot) and writes OK or NOT_RUN: <reason>; a
        # NOT_RUN fails the job here, after the status is uploaded by the next step.
        run: tools/ci/vcan_preflight.sh artifacts/preflight/vcan-status.txt
      - name: Keep the vcan preflight status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vcan-preflight-status
          path: artifacts/preflight/vcan-status.txt
          if-no-files-found: error
      - name: Fit the memory layout to ThreadSanitizer
        # GCC 13's TSan runtime cannot place its shadow memory when mmap is randomized with more
        # than 28 bits; the TSan stage fails loudly ("unexpected memory mapping") if this is missing.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Run checks
        # NET_ADMIN: the vcan stage creates vcan_host and vcan_device in the container's namespace.
        run: >-
          docker run --rm --init --cap-add NET_ADMIN -v "$PWD:/ws" -w /ws robotics-dev:ci
          tools/ci/run_checks.sh
      - name: Build and smoke-run the runtime image
        # Built on the dev image checked above (BUILD_FROM), so the model is not fetched again.
        # The dev stage's build args are left out on purpose: a build that ran that stage anyway
        # fails on them, and the log check below fails it too.
        run: |
          set -o pipefail
          set -a; . ./.env; set +a
          docker build --progress=plain --target runtime --build-arg ROS_IMAGE="$ROS_IMAGE" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" --build-arg BUILD_FROM=robotics-dev:ci \
            -t robotics-runtime:ci -f docker/Dockerfile . 2>&1 | tee "$RUNNER_TEMP/runtime-build.log"
          if grep -q 'menagerie.py fetch' "$RUNNER_TEMP/runtime-build.log"; then
            echo 'the runtime build ran the dev stage (model fetch) instead of using robotics-dev:ci' >&2
            exit 1
          fi
          docker run --rm robotics-runtime:ci --scenario normal --defect none --out /tmp/t.jsonl
          rc=0; docker run --rm robotics-runtime:ci --scenario nope --defect none --out /tmp/t.jsonl || rc=$?
          test "$rc" -eq 2
      - name: Keep test results, coverage and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-artifacts
          path: |
            artifacts/
            build/release/*/Testing/
            build/asan/*/Testing/
            build/tsan/*/Testing/
          if-no-files-found: warn

