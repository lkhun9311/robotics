name: ci
on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: |
          set -a; . ./.env; set +a
          docker build --target dev --build-arg ROS_IMAGE="$ROS_IMAGE" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" -t robotics-dev:ci -f docker/Dockerfile .
      - name: Run checks
        run: docker run --rm -v "$PWD:/ws" -w /ws robotics-dev:ci tools/ci/run_checks.sh
      - name: Build and smoke-run the runtime image
        run: |
          set -a; . ./.env; set +a
          docker build --target runtime --build-arg ROS_IMAGE="$ROS_IMAGE" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" -t robotics-runtime:ci -f docker/Dockerfile .
          docker run --rm robotics-runtime:ci --scenario normal --defect none --out /tmp/t.jsonl
          rc=0; docker run --rm robotics-runtime:ci --scenario nope --defect none --out /tmp/t.jsonl || rc=$?
          test "$rc" -eq 2
      - name: Keep test results, coverage and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-artifacts
          path: |
            artifacts/
            build/release/runtime_core/Testing/
            build/asan/runtime_core/Testing/
          if-no-files-found: warn

  probe-vcan:
    # Records whether hosted runners allow vcan (spec §13). Not gating: the result is a
    # status file that says OK or NOT_RUN with the reason, never a silent green.
    runs-on: ubuntu-24.04
    steps:
      - name: Probe vcan
        run: |
          set +e
          out=$( { sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && \
                   sudo ip link set up vcan0 && ip -details link show vcan0; } 2>&1 )
          rc=$?
          if [ $rc -eq 0 ]; then echo "OK" > vcan-status.txt; else echo "NOT_RUN rc=$rc" > vcan-status.txt; fi
          echo "$out" >> vcan-status.txt
          cat vcan-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vcan-status
          path: vcan-status.txt
